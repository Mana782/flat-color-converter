<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flat Color Converter</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#202434;background:#f3f5f9}*{box-sizing:border-box}body{margin:0}header{background:#202942;color:#fff;padding:19px max(20px,calc((100% - 1120px)/2))}h1{font-size:22px;margin:0}header p{margin:5px 0 0;color:#cbd5e1;font-size:13px}main{max-width:1120px;margin:auto;padding:20px;display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:18px}.panel{background:white;border-radius:14px;padding:20px;box-shadow:0 2px 12px #19223b12}.panel h2{font-size:16px;margin:0 0 18px}.field{margin:18px 0}.field label,.caption{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}input[type=range]{width:100%;accent-color:#5969d7}input[type=file]{max-width:100%;font-size:13px}.hint{color:#636b7b;font-size:12px;line-height:1.65}.options{display:flex;align-items:center;gap:8px;font-size:14px;margin:12px 0}button{padding:12px 16px;border:0;border-radius:9px;background:#5865ce;color:#fff;font-size:14px;font-weight:700;cursor:pointer}button:disabled{background:#b1b8c8;cursor:not-allowed}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tabs button{background:#e9ebf4;color:#343b55;font-weight:500;padding:8px 12px}.tabs button.active{background:#5362ca;color:#fff}.canvas-holder{background:#dfe4ed;min-height:320px;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:auto;background-image:linear-gradient(45deg,#e9edf3 25%,transparent 25%),linear-gradient(-45deg,#e9edf3 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e9edf3 75%),linear-gradient(-45deg,transparent 75%,#e9edf3 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}canvas{display:block;max-width:100%;max-height:65vh;object-fit:contain}#stats{font-size:14px;font-weight:700;margin-top:15px}#palette{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.swatch{width:28px;height:28px;border:1px solid #ffffffad;border-radius:5px;box-shadow:0 0 0 1px #ddd}.status{font-size:13px;color:#586175;line-height:1.7;min-height:26px}.action{width:100%;margin-top:12px}.drop{border:2px dashed #b7bfd7;padding:18px;border-radius:10px;text-align:center}.drop.over{background:#eff2ff;border-color:#5865ce}hr{border:0;border-top:1px solid #e9eaf1;margin:22px 0}@media(max-width:760px){main{grid-template-columns:1fr;padding:12px}.canvas-holder{min-height:220px}header{padding:18px}}</style>
</head><body><header><h1>Flat Color Converter</h1><p>AI塗り分けPNG → 黒線除去 → 色の塗り足し → レイヤー付きPSD</p></header><main>
<section class="panel"><h2>入力・処理設定</h2><div class="drop" id="drop"><div style="margin-bottom:8px">塗り分け済みPNGを選択／ドロップ</div><input type="file" id="file" accept="image/png,image/jpeg,image/webp"></div><p class="hint">画像はブラウザ内で処理され、サーバーへ送信されません。</p>
<hr><div class="field"><label for="dark">黒判定（RGB各成分の最大値）<output id="darkVal">90</output></label><input id="dark" type="range" min="0" max="200" value="90"><p class="hint">この値以下の暗いピクセルを主線・黒ベタとして除去します。</p></div>
<div class="field"><label for="expand">黒周囲の追加除去 <output id="expandVal">2 px</output></label><input id="expand" type="range" min="0" max="12" value="2"></div>
<div class="field"><label for="tolerance">近似色の統合（RGB距離）<output id="toleranceVal">35</output></label><input id="tolerance" type="range" min="0" max="150" value="35"><p class="hint">似た色を同じレイヤーにまとめます。上げすぎると別パーツも統合されます。</p></div>
<label class="options"><input type="checkbox" id="regions">連結領域ごとにレイヤー分割</label><label class="options"><input type="checkbox" id="white" checked>白色もレイヤーに含める</label><p class="hint">白を除外すると、白い領域は透明になります。</p>
<button class="action" id="run" disabled>プレビューを更新</button><button class="action" id="export" disabled>PSDを書き出す</button><p id="status" class="status" aria-live="polite">画像を読み込んでください。</p></section>
<section class="panel"><h2>処理結果プレビュー</h2><div class="tabs"><button class="active" data-view="original">元画像</button><button data-view="mask">除去範囲</button><button data-view="normalized">正規化</button><button data-view="filled">塗り足し結果</button></div><div class="canvas-holder"><canvas id="preview"></canvas></div><div id="stats">画像未読み込み</div><div id="palette"></div><p class="hint">除去範囲は赤で表示します。塗り足し結果では黒い線の下まで色が延長されます。</p></section>
</main><script src="https://cdn.jsdelivr.net/npm/ag-psd@6.2.0/dist/bundle.js"></script><script>
'use strict';
const $=id=>document.getElementById(id), preview=$('preview'), ctx=preview.getContext('2d',{willReadFrequently:true});
let input=null, result=null, currentView='original', name='flat-colors';
const controls=['dark','expand','tolerance','regions','white'];
function status(s){$('status').textContent=s;}
function render(){if(!input)return;const w=input.width,h=input.height;preview.width=w;preview.height=h;let bytes;
if(currentView==='original'||!result)bytes=input.data;
else if(currentView==='mask'){bytes=new Uint8ClampedArray(input.data);for(let i=0;i<w*h;i++)if(result.mask[i]){bytes[i*4]=245;bytes[i*4+1]=55;bytes[i*4+2]=65;bytes[i*4+3]=255;}}
else if(currentView==='normalized') bytes=result.normalized;
else bytes=result.filled;
ctx.putImageData(new ImageData(new Uint8ClampedArray(bytes),w,h),0,0);
}
function ranges(){for(const id of ['dark','expand','tolerance'])$(id+'Val').textContent=$(id).value+(id==='expand'?' px':'');}
controls.forEach(id=>{$(id).addEventListener('input',()=>{ranges();if(input)status('設定を変更しました。「プレビューを更新」を押してください。');});});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{currentView=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render();}));
async function load(file){if(!file)return;try{status('画像読み込み中…');const bmp=await createImageBitmap(file);const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(bmp,0,0);input=x.getImageData(0,0,c.width,c.height);bmp.close();name=file.name.replace(/\.[^.]+$/,'');result=null;$('run').disabled=false;$('export').disabled=true;$('stats').textContent=`${input.width} × ${input.height} px`;$('palette').replaceChildren();render();status('読み込みました。処理を開始します。');await new Promise(r=>setTimeout(r,40));await process();}catch(e){console.error(e);status('読み込みに失敗しました: '+e.message);}}
$('file').addEventListener('change',e=>load(e.target.files[0]));const drop=$('drop');drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});drop.addEventListener('dragleave',()=>drop.classList.remove('over'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');load(e.dataTransfer.files[0]);});
$('run').addEventListener('click',process);
function clamp255(n){return Math.max(0,Math.min(255,Math.round(n)));}
function makeImage(ids,colors,w,h){const a=new Uint8ClampedArray(w*h*4);for(let i=0;i<ids.length;i++){const k=ids[i];if(k<0)continue;const p=i*4,c=colors[k];a[p]=c[0];a[p+1]=c[1];a[p+2]=c[2];a[p+3]=255;}return a;}
function processSync(){const {width:w,height:h,data}=input,n=w*h, dark=+$('dark').value,extra=+$('expand').value,tolerance=+$('tolerance').value;
const mask=new Uint8Array(n),base=new Uint8Array(n),queue=new Int32Array(n);
// Dark pixels = lines, large black fills, and ink pools, without exceptions.
for(let i=0;i<n;i++){const p=i*4;if(data[p+3]<16||Math.max(data[p],data[p+1],data[p+2])<=dark){base[i]=1;mask[i]=1;}}
// Chebyshev distance dilation, expanded by exact selected pixel count.
if(extra){let head=0,tail=0;const dist=new Uint8Array(n);for(let i=0;i<n;i++)if(base[i])queue[tail++]=i;while(head<tail){const i=queue[head++],d=dist[i];if(d>=extra)continue;const x=i%w,y=(i/w)|0;for(let yy=Math.max(0,y-1);yy<=Math.min(h-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(w-1,x+1);xx++){const j=yy*w+xx;if(!mask[j]){mask[j]=1;dist[j]=d+1;queue[tail++]=j;}}}}
// Cluster visible RGB colors by quantized 5-bit histogram, then tolerance.
const hist=new Map();for(let i=0;i<n;i++){if(mask[i])continue;const p=i*4,r=data[p],g=data[p+1],b=data[p+2],key=((r>>3)<<10)|((g>>3)<<5)|(b>>3);let v=hist.get(key);if(!v){v=[0,0,0,0];hist.set(key,v);}v[0]+=r;v[1]+=g;v[2]+=b;v[3]++;}
let bins=[...hist.values()].sort((a,b)=>b[3]-a[3]);let clusters=[];const binIds=new Map(); // quantized key -> candidate cluster
for(const b of bins){const color=[b[0]/b[3],b[1]/b[3],b[2]/b[3]];let target=-1,best=tolerance*tolerance;for(let k=0;k<clusters.length;k++){const c=clusters[k],d=(color[0]-c[0])**2+(color[1]-c[1])**2+(color[2]-c[2])**2;if(d<=best){best=d;target=k;}}
if(target===-1)clusters.push([color[0],color[1],color[2],b[3]]);else {const c=clusters[target],total=c[3]+b[3];for(let z=0;z<3;z++)c[z]=(c[z]*c[3]+color[z]*b[3])/total;c[3]=total;}}
if(!clusters.length)throw Error('有効な塗り色がありません。黒判定を下げてください。');
const colors=clusters.map(c=>c.slice(0,3).map(clamp255)), ids=new Int32Array(n).fill(-1);
for(let i=0;i<n;i++){if(mask[i])continue;const p=i*4;let best=Infinity,kBest=0;for(let k=0;k<colors.length;k++){const c=colors[k],d=(data[p]-c[0])**2+(data[p+1]-c[1])**2+(data[p+2]-c[2])**2;if(d<best){best=d;kBest=k;}}ids[i]=kBest;}
const normalized=makeImage(ids,colors,w,h);
// Multi-source BFS: fill erased black/AA pixels with nearest surviving color.
let head=0,tail=0;for(let i=0;i<n;i++)if(ids[i]>=0)queue[tail++]=i;
while(head<tail){const i=queue[head++],x=i%w,y=(i/w)|0;const near=[x>0?i-1:-1,x<w-1?i+1:-1,y>0?i-w:-1,y<h-1?i+w:-1];for(const j of near)if(j>=0&&ids[j]<0){ids[j]=ids[i];queue[tail++]=j;}}
const filled=makeImage(ids,colors,w,h);const excludeWhite=!$('white').checked;
const selected=colors.map(c=>!(excludeWhite&&Math.min(...c)>=242));
let parts=[];if($('regions').checked){const seen=new Uint8Array(n),q=new Int32Array(n);for(let i=0;i<n;i++){const k=ids[i];if(seen[i]||!selected[k])continue;let hd=0,tl=1;q[0]=i;seen[i]=1;const pixels=[];while(hd<tl){const t=q[hd++],x=t%w,y=(t/w)|0;pixels.push(t);const near=[x>0?t-1:-1,x<w-1?t+1:-1,y>0?t-w:-1,y<h-1?t+w:-1];for(const j of near)if(j>=0&&!seen[j]&&ids[j]===k){seen[j]=1;q[tl++]=j;}}parts.push({color:k,pixels});}}else{for(let k=0;k<colors.length;k++)if(selected[k])parts.push({color:k,pixels:null});}
return {mask,normalized,filled,ids,colors,parts,selected,w,h,mode:$('regions').checked};}
async function process(){if(!input)return;$('run').disabled=true;$('export').disabled=true;status('主線除去・塗り足し・レイヤー解析中…');await new Promise(r=>setTimeout(r,35));try{result=processSync();const count=result.parts.length;$('stats').textContent=`${result.w} × ${result.h}px ｜ ${result.colors.length}色 ｜ 出力 ${count} レイヤー`;$('palette').replaceChildren();result.colors.forEach((c,i)=>{const el=document.createElement('span');el.className='swatch';el.style.background=`rgb(${c.join(',')})`;el.title=`色 ${i+1}: RGB(${c.join(',')})`; $('palette').append(el);});$('export').disabled=count===0||count>600;status(count>600?'レイヤーが600枚を超えています。連結領域モードを解除するか色を統合してください。':'処理完了。プレビューを切り替えて確認できます。');render();}catch(e){console.error(e);result=null;status('処理エラー: '+e.message);}finally{$('run').disabled=false;}}
$('export').addEventListener('click',async()=>{if(!result)return;$('export').disabled=true;status('PSDを作成中…');await new Promise(r=>setTimeout(r,35));try{if(!window.agPsd||!agPsd.writePsd)throw Error('PSDライブラリを読み込めません。ネットワーク接続を確認してください。');const {w,h,parts,ids,colors}=result;const children=[];
for(let pi=0;pi<parts.length;pi++){const part=parts[pi],k=part.color,rgba=new Uint8ClampedArray(w*h*4),c=colors[k];if(part.pixels){for(const i of part.pixels){const p=i*4;rgba[p]=c[0];rgba[p+1]=c[1];rgba[p+2]=c[2];rgba[p+3]=255;}}else{for(let i=0;i<ids.length;i++)if(ids[i]===k){const p=i*4;rgba[p]=c[0];rgba[p+1]=c[1];rgba[p+2]=c[2];rgba[p+3]=255;}}const layer=document.createElement('canvas');layer.width=w;layer.height=h;layer.getContext('2d').putImageData(new ImageData(rgba,w,h),0,0);children.push({name:`${String(pi+1).padStart(3,'0')} - RGB ${c.join('-')}${result.mode?' - region':''}`,canvas:layer});}
const composite=document.createElement('canvas');composite.width=w;composite.height=h;const cp=composite.getContext('2d');const a=new Uint8ClampedArray(result.filled);for(let i=0;i<ids.length;i++)if(!result.selected[ids[i]])a[i*4+3]=0;cp.putImageData(new ImageData(a,w,h),0,0);
const buffer=agPsd.writePsd({width:w,height:h,children,canvas:composite});const blob=new Blob([buffer],{type:'image/vnd.adobe.photoshop'}),url=URL.createObjectURL(blob),aLink=document.createElement('a');aLink.href=url;aLink.download=name+'-layers.psd';document.body.appendChild(aLink);aLink.click();aLink.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);status(`PSDを書き出しました（${children.length}レイヤー）。`);}catch(e){console.error(e);status('PSD作成エラー: '+e.message);}finally{$('export').disabled=false;}});
ranges();
</script></body></html>
